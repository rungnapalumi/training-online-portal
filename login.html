<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI People Reader™</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .login-box {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        
        .login-box h2 {
            text-align: center;
            color: #3d3630;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .login-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #3d3630;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #d4c5b9;
            border-radius: 4px;
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #c4a57b;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #c4a57b;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Libre Baskerville', serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .login-btn:hover {
            background-color: #b8956a;
        }
        
        .login-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        .lock-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
            color: #c4a57b;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">AI PEOPLE READER™</h1>
                <div class="header-right">
                    <div class="language-toggle">
                        <button id="langToggle" class="lang-btn" onclick="toggleLoginLanguage()">
                            <span id="currentLang">EN</span> | <span id="otherLang">TH</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="lock-icon">🔒</div>
            <h2>Training Portal Login</h2>
            <p class="subtitle">Please enter your credentials</p>
            
            <div id="errorMessage" class="error-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autocomplete="username"
                        placeholder="Enter your username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 AI People Reader™. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Login page translations
        const loginTranslations = {
            en: {
                title: "Training Portal Login",
                subtitle: "Please enter your credentials",
                usernameLabel: "Username",
                usernamePlaceholder: "Enter your username",
                passwordLabel: "Password",
                passwordPlaceholder: "Enter your password",
                loginBtn: "Login",
                loggingIn: "Logging in...",
                invalidCredentials: "Invalid credentials. Please try again.",
                loginFailed: "Login failed. Please try again."
            },
            th: {
                title: "เข้าสู่ระบบพอร์ทัลการฝึกอบรม",
                subtitle: "กรุณากรอกข้อมูลประจำตัวของคุณ",
                usernameLabel: "ชื่อผู้ใช้",
                usernamePlaceholder: "กรอกชื่อผู้ใช้ของคุณ",
                passwordLabel: "รหัสผ่าน",
                passwordPlaceholder: "กรอกรหัสผ่านของคุณ",
                loginBtn: "เข้าสู่ระบบ",
                loggingIn: "กำลังเข้าสู่ระบบ...",
                invalidCredentials: "ข้อมูลประจำตัวไม่ถูกต้อง กรุณาลองอีกครั้ง",
                loginFailed: "เข้าสู่ระบบล้มเหลว กรุณาลองอีกครั้ง"
            }
        };
        
        let currentLang = localStorage.getItem('language') || 'en';
        
        function updateLoginLanguage() {
            const t = loginTranslations[currentLang];
            
            document.querySelector('.login-box h2').textContent = t.title;
            document.querySelector('.login-box .subtitle').textContent = t.subtitle;
            document.querySelector('label[for="username"]').textContent = t.usernameLabel;
            document.getElementById('username').placeholder = t.usernamePlaceholder;
            document.querySelector('label[for="password"]').textContent = t.passwordLabel;
            document.getElementById('password').placeholder = t.passwordPlaceholder;
            loginBtn.textContent = t.loginBtn;
            
            // Update language toggle
            document.getElementById('currentLang').textContent = currentLang === 'en' ? 'EN' : 'TH';
            document.getElementById('otherLang').textContent = currentLang === 'en' ? 'TH' : 'EN';
        }
        
        function toggleLoginLanguage() {
            currentLang = currentLang === 'en' ? 'th' : 'en';
            localStorage.setItem('language', currentLang);
            updateLoginLanguage();
        }
        
        // Initialize language on page load
        updateLoginLanguage();
        
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const t = loginTranslations[currentLang];
            
            // Disable button and show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = t.loggingIn;
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Redirect to user-specific page
                    window.location.href = data.redirectTo || '/';
                } else {
                    // Show error message
                    errorMessage.textContent = data.error || t.invalidCredentials;
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = t.loginBtn;
                }
            } catch (error) {
                errorMessage.textContent = t.loginFailed;
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = t.loginBtn;
            }
        });
        
        // Clear error message when user starts typing
        document.getElementById('username').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });
        
        document.getElementById('password').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });
    </script>
</body>
</html>
