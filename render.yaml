# Render Blueprint — Node.js web service with authentication
# https://render.com/docs/web-services
services:
  - type: web
    name: training-online-portal
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_USERS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
